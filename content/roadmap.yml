title: Build status
lede: >
  What is live on the site today, and what is still to be written. This page is
  generated from content/roadmap.yml — update that file and it updates here.

# status: done | progress | planned
sections:
  - name: Platform
    blurb: The site itself — how pages are built, verified, and shipped.
    items:
      - status: done
        title: Static site generator
        detail: >
          Markdown in content/ builds to HTML in _site/. Multi-course aware:
          adding a course needs a directory, a course.yml, and Markdown files —
          no code change.
      - status: done
        title: Design system
        detail: >
          Blueprint theme with per-track accent colours, DM Sans / Fira Code,
          and full dark mode driven by the viewer's system setting.
      - status: done
        title: Math, diagrams, and code rendering
        detail: >
          KaTeX for inline and display math; Mermaid diagrams with pan, zoom,
          and full-size view; syntax-labelled code blocks; scrollable tables.
      - status: done
        title: Continuous deployment
        detail: >
          Pushes to main build and publish to GitHub Pages automatically.
          Pull requests run the same build without deploying.
      - status: done
        title: Build verification
        detail: >
          Every deploy is gated on a check suite asserting that each source file
          produced a page, every internal link resolves, every diagram rendered,
          and math survived the pipeline. A static site fails silently; this is
          what stops a broken link from shipping.
      - status: done
        title: Custom domain and HTTPS
        detail: mlinterviewnotes.com, served over TLS.
      - status: done
        title: Diagram correctness audit
        detail: >
          All 67 course diagrams were checked twice — mechanically, that every
          one parses and renders; and semantically, that each agrees with the
          prose around it and with the reference implementation. 55 were correct
          as written, 12 carried inaccuracies, and all 12 are now fixed. No
          diagram was found to teach anything false.
      - status: done
        title: Interactive widget support
        detail: >
          Pages can embed raw HTML blocks and pull in their own scripts, so
          D3-driven explanations live alongside ordinary Markdown.
      - status: planned
        title: Site-wide search
        detail: >
          Client-side index across all courses and notes. No backend needed at
          this scale.
      - status: planned
        title: Contribution guide
        detail: >
          A CONTRIBUTING.md covering the Markdown conventions, how to preview
          locally, and what the verification pass checks.

  - name: Courses
    blurb: Long-form, sequential material built from first principles.
    items:
      - status: done
        title: Transformers Deep Dive — 17 modules
        detail: >
          From "why did we abandon RNNs?" through to the configuration choices
          in production 2026 models. Includes 67 diagrams, worked numeric
          examples, self-check questions, and a runnable reference decoder.
      - status: done
        title: The Inference Engineering Book — 14 chapters
        detail: >
          How LLM serving systems actually work, read out of the vLLM and SGLang
          source: continuous batching, PagedAttention and RadixAttention,
          quantization, parallelism, speculative decoding, and honest
          benchmarking. 91 pages with 304 diagrams and hands-on labs. Ships as
          prebuilt HTML re-themed to the site palette — see the note below.
      - status: planned
        title: Bring the inference book into the Markdown pipeline
        detail: >
          That course has no Markdown sources, so it is published as finished
          HTML and re-themed through CSS custom properties rather than converted.
          Converting 3,300+ code blocks of dense systems material would risk
          corrupting content that is currently correct. Until it is converted it
          cannot be edited the way the rest of the site can.
      - status: planned
        title: Classical ML refresher
        detail: >
          Linear and logistic regression, trees and ensembles, SVMs,
          clustering — derived rather than recited.
      - status: planned
        title: LLM training and fine-tuning
        detail: Pretraining, SFT, preference optimisation, LoRA and friends.

  - name: Notes
    blurb: >
      Topic-by-topic reference notes. All five categories are written — 53
      pages that derive their subject end to end rather than listing
      definitions.
    items:
      - status: done
        title: Math for ML — 8 topics written
        detail: >
          Linear algebra (with five interactive visualizations), calculus and
          matrix calculus, probability, statistics and inference, optimization,
          information theory, discrete mathematics, and numerical computing.
          Each page derives its subject end to end — worked examples, diagrams,
          failure modes, and self-check questions — rather than listing
          definitions.
      - status: done
        title: Libraries for ML — 9 topics written
        detail: >
          NumPy, pandas, scikit-learn, PyTorch, TensorFlow and Keras, the
          boosting libraries, visualization, the Hugging Face stack, and MLOps
          and serving. Each page teaches the library's underlying model — memory
          layout, index alignment, the estimator contract, tracing, the
          fit/transform boundary — rather than listing API calls.
      - status: done
        title: Machine Learning — 12 topics written
        detail: >
          Problem framing, linear models, trees and ensembles, SVMs and kernels,
          probabilistic and instance-based models, unsupervised learning,
          bias-variance and generalization, model evaluation, feature
          engineering, hyperparameter tuning, imbalanced data and practical
          pitfalls, and ethics and fairness. Derivations rather than
          definitions, with worked examples, failure modes, and self-check
          questions on every page.
      - status: done
        title: Deep Learning — 12 topics written
        detail: >
          Neural networks and backpropagation, activations and initialization,
          optimization and training, regularization and normalization, CNNs,
          RNNs and sequence models, attention and transformers, transfer
          learning and PEFT, generative models, self-supervised learning, and
          deep reinforcement learning including RLHF, DPO and GRPO. Each
          architecture is introduced by the problem it solves.
      - status: done
        title: NLP — 12 topics written
        detail: >
          Preprocessing and tokenization, text representation, language models,
          classification, sequence labeling, machine translation, generation and
          decoding, pretrained model families, prompting and alignment, RAG and
          retrieval, speech and audio, and evaluation. Organised by problem
          rather than by model, so the pages survive the next architecture.
      - status: done
        title: One page per topic
        detail: >
          Notes are two levels: a category page lists its topics, and each
          written topic is its own page beneath it — /notes/math/ holds
          /notes/math/linear-algebra/. A topic never sits beside the category
          it belongs to.

  - name: Sections still to build
    blurb: >
      Planned in the original site and carried forward here. Both were empty in
      the previous database, so both start from scratch.
    items:
      - status: planned
        title: Question & Answer
        detail: >
          Interview questions with worked answers, explanations, and code —
          organised by category and difficulty.
      - status: planned
        title: System Design
        detail: >
          ML system design patterns: problem statement, architecture, key
          components, scaling considerations, and trade-offs.
