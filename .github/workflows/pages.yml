name: Build and deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site/requirements.txt

      - name: Install build dependencies
        run: pip install -r site/requirements.txt

      - name: Build
        run: python site/build.py

      - name: Verify build
        run: python site/test_build.py

      - name: Verify reading experience and preserved content
        run: python site/test_presentation.py

      - name: Verify executable coverage and downloadable source
        run: python site/test_curriculum_examples.py --check-only --published

      - name: Verify inference arithmetic and lab parser regressions
        run: |
          pip install -r content/courses/inference/html/labs/09-structured-decoding-overhead/requirements.txt
          python content/courses/inference/html/labs/cpu_checks.py
          python content/courses/inference/html/labs/quant_parallel_checks.py
          python site/test_inference_references.py
          python site/test_inference_scheduler.py

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  curriculum-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            site/requirements.txt
            site/requirements-examples.txt
            site/requirements-boosters.txt
            site/requirements-corrections.txt
      - name: Install CPU PyTorch
        run: pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install curriculum environment
        run: pip install -r site/requirements.txt -r site/requirements-examples.txt -r site/requirements-boosters.txt -r site/requirements-corrections.txt
      - name: Execute all ML and DL examples independently
        run: python site/test_curriculum_examples.py --include-boosters --report /tmp/curriculum-examples.json
      - name: Verify math and Transformer numerical contracts
        run: |
          python site/test_math_corrections.py
          python site/test_transformer_corrections.py
          python site/test_transformer_training.py
          python site/test_library_nlp_corrections.py
          python site/test_artifact_capstone.py
          python site/test_inference_foundations.py
          python site/test_inference_06_08_corrections.py
          python site/test_inference_serving.py
          python site/test_inference_engine_deepdives.py
      - name: Retain example results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curriculum-example-results
          path: /tmp/curriculum-examples.json

  deploy:
    needs: [build, curriculum-examples]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
